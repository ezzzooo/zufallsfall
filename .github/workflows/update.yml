name: Seite bauen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"  # montags früh: neue Folgen von dreimetadaten.de holen
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub schaltet zeitgesteuerte Abläufe nach 60 Tagen ohne Änderung im Repository ab.
  # Der wöchentliche Lauf hinterlässt deshalb eine kleine Änderung, auch wenn das Bauen scheitert.
  wachhalten:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%d %H:%M UTC" > .github/letzter-lauf.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/letzter-lauf.txt
          git commit -m "Wöchentlicher Lauf" && git push
